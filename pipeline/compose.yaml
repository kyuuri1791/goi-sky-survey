# データを作る環境。npm run data:all などから呼ぶ
name: goi-sky-survey
services:
  pipeline:
    build: .
    image: goi-pipeline
    # 鍵(NG_KEY)は pipeline/.env から環境変数で渡す(ルートの .env だと Next.js がビルド結果にコピーしてしまうので置かない)
    env_file: .env
    volumes:
      - .:/app # コードと ng.enc
      - ../data:/out # 書き出し先
      - ../vendor/vec1:/vec1:ro # SQLite の vec1 の拡張
      - work:/work # 元データと途中結果(手元のディレクトリを汚さない)
    # 復号した除外語の一覧はここ(メモリ上)にだけ置く
    tmpfs:
      - /tmp
volumes:
  work:
